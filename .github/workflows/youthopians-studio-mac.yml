name: Youthopians Studio macOS build

on:
  push:
    branches: [claude/youthful-shannon-uuqssp]
    paths:
      - 'youthopians-studio/**'
      - '.github/workflows/youthopians-studio-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youthopians-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y genisoimage

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Mac app bundles (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --arm64 --x64 --publish never

      - name: Package DMGs
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for ARCH in arm64 x64; do
            if [ "$ARCH" = "arm64" ]; then DIR=release/mac-arm64; else DIR=release/mac; fi
            STAGE="stage-$ARCH"
            mkdir -p "$STAGE"
            cp -a "$DIR/Youthopians Studio.app" "$STAGE/"
            ln -sfn /Applications "$STAGE/Applications"
            genisoimage -quiet -V "Youthopians Studio" -D -R -apple -no-pad \
              -o "release/Youthopians-Studio-$VERSION-$ARCH.dmg" "$STAGE"
          done
          ls -lh release/*.dmg

      - name: Publish release with DMGs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youthopians-studio-v1.0.${{ github.run_number }}
          name: Youthopians Studio 1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Mac installers for Youthopians Studio.

            - **Apple Silicon (M1–M4):** `Youthopians-Studio-*-arm64.dmg`
            - **Intel Mac:** `Youthopians-Studio-*-x64.dmg`

            1. Open the DMG and drag **Youthopians Studio** into **Applications**.
            2. The app is not notarized by Apple. Before the first launch, run once in Terminal:
               `xattr -cr "/Applications/Youthopians Studio.app"`
            3. Open the app. If macOS still blocks it: System Settings → Privacy & Security → **Open Anyway**.
          files: youthopians-studio/release/*.dmg
