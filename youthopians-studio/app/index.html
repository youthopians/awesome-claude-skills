/* ---------- actions ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function commit(msg){save();render();if(msg)toast(msg)}

const actions={
  'menu':()=>document.getElementById('side').classList.toggle('open'),
  'close-drawer':()=>closeDrawer(),
  'close-modal':()=>closeModal(),
  'theme':()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);S.ui.theme=nx;save()},
  'tab':el=>{S.ui.tab[el.dataset.id]=el.dataset.tab;commit()},
  'collapse':el=>{S.ui.collapsed[el.dataset.id]=!S.ui.collapsed[el.dataset.id];commit()},
  'cal':el=>{const d=+el.dataset.d;if(!d){S.ui.calMonth=null}else{const c=parse(S.ui.calMonth||ymd(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)));c.setMonth(c.getMonth()+d);S.ui.calMonth=ymd(c)}commit()},
  'open-task':el=>openDrawer('task',el.dataset.id),
  'open-delivery':el=>openDrawer('delivery',el.dataset.id),
  'open-assumption':el=>openDrawer('assumption',el.dataset.id),
  'toggle-done':el=>{const t=T(el.dataset.id);t.status=t.status==='done'?'todo':'done';if(t.status==='done')log('completed “'+t.title+'”');commit(t.status==='done'?'Task completed':'Task reopened')},
  'del-task':el=>confirmBox('Delete this task?','The task, its subtasks and comments will be removed.',()=>{S.tasks=S.tasks.filter(t=>t.id!==el.dataset.id);drawerState=null;closeDrawer(true);commit('Task deleted')}),
  'del-delivery':el=>confirmBox('Delete this deliverable?','Its 5-step check history will be removed.',()=>{S.deliveries=S.deliveries.filter(t=>t.id!==el.dataset.id);closeDrawer(true);commit('Deliverable deleted')}),
  'del-assumption':el=>confirmBox('Delete this assumption?','It will be removed from the register.',()=>{S.assumptions=S.assumptions.filter(t=>t.id!==el.dataset.id);closeDrawer(true);commit('Assumption deleted')}),
  'sub-toggle':el=>{const t=T(el.dataset.id);const s=t.subtasks[+el.dataset.i];s.d=!s.d;commit()},
  'sub-del':el=>{const t=T(el.dataset.id);t.subtasks.splice(+el.dataset.i,1);commit()},
  'qc-item':el=>{const d=D(el.dataset.id);d.checks[+el.dataset.i].items[+el.dataset.j]=el.checked;save();render()},
  'qc-sign':el=>{const d=D(el.dataset.id),i=+el.dataset.i;const c=d.checks[i];if(!c.items.every(Boolean))return toast('Tick every check before signing off');if(i!==qcStep(d))return;const sel=document.getElementById('so-'+d.id+'-'+i);c.by=sel?sel.value:S.me;c.at=nowStamp();d.returned='';log('signed off step '+(i+1)+' ('+QC[i].name+') on “'+d.title+'”');commit('Step '+(i+1)+' signed off')},
  'qc-unsign':el=>{const d=D(el.dataset.id),i=+el.dataset.i;d.checks[i].by='';d.checks[i].at='';commit('Sign-off removed')},
  'qc-return':el=>{const d=D(el.dataset.id),i=+el.dataset.i;
    modal('Return for fixes',`<p class="muted" style="margin:0">Describe what failed at step ${i+1} (${QC[i].name}). A fix task is created for the deliverable owner, and the check restarts from this step.</p><label class="lbl">What needs fixing<textarea class="field" name="note" id="ret-note" required placeholder="e.g. Subtitles drift from 04:12; lower-third spells the cooperative name wrong"></textarea></label>`,'Return and create fix task',data=>{
      const note=(data.note||'').trim();if(!note)return false;
      for(let k=i;k<5;k++){d.checks[k].by='';d.checks[k].at='';d.checks[k].items=d.checks[k].items.map(()=>false)}
      d.returned=note;d.returns=d.returns||[];d.returns.unshift({step:i+1,by:S.me,at:nowStamp(),note});
      S.tasks.push({id:uid('t'),projectId:d.projectId,title:'Fix: '+note.slice(0,70),phase:3,assignee:d.owner||S.me,start:ymd(TODAY),due:addDays(2),priority:'High',status:'todo',subtasks:[],comments:[],notes:'Returned from delivery check step '+(i+1)+' on “'+d.title+'”.\n\n'+note});
      log('returned “'+d.title+'” at step '+(i+1));commit('Returned. Fix task created');
    })},
  'mark-delivered':el=>{const d=D(el.dataset.id);if(qcStep(d)<5)return toast('All five steps must be signed off first');d.status='Delivered';d.deliveredAt=nowStamp();log('marked “'+d.title+'” as delivered');commit('Recorded as delivered')},
  'as-decide':el=>{const a=A(el.dataset.id);a.outcome=document.getElementById('a-oc-'+a.id).value;a.outcomeNote=document.getElementById('a-on-'+a.id).value;a.decidedBy=S.me;a.decidedAt=nowStamp();
    if(a.outcome.startsWith('Rejected'))S.tasks.push({id:uid('t'),projectId:a.projectId,title:'Change request: '+a.text.replace(/^We assume\s*/i,'').slice(0,60),phase:0,assignee:(P(a.projectId)||{}).lead||S.me,start:ymd(TODAY),due:addDays(3),priority:'High',status:'todo',subtasks:[{t:'Update scope, budget or schedule',d:false},{t:'Get client sign-off on the change',d:false}],comments:[],notes:'Assumption rejected: '+a.text+'\n\n'+a.outcomeNote});
    log('logged assumption as '+a.outcome.toLowerCase());commit(a.outcome.startsWith('Rejected')?'Logged. Change request task created':'Decision logged')},
  'as-reopen':el=>{const a=A(el.dataset.id);a.outcome='';a.decidedBy='';a.decidedAt='';commit()},
  'new-project':()=>modal('New project',projectForm()+`<label class="qitem"><input type="checkbox" name="tpl" id="pf-tpl" checked><span>Create the production phase tasks and standard assumptions for this project type</span></label>`,'Create project',data=>{
      if(data.due<data.start){toast('Final delivery must be after the start date');return false}
      const p={id:uid('p'),name:data.name,client:data.client||'—',type:data.type,status:'Not started',lead:data.lead,start:data.start,due:data.due,budget:+data.budget||0,currency:data.currency,color:data.color,description:data.description};
      S.projects.push(p);if(data.tpl){applyTemplate(S,p,false);TEMPLATE_ASSUMPTIONS.forEach(([c,t])=>S.assumptions.push({id:uid('a'),projectId:p.id,category:c,text:'We assume '+t.charAt(0).toLowerCase()+t.slice(1),evidence:'',confidence:'',ifWrong:'',impact:0,likelihood:0,owner:'',method:'',by:'',outcome:'',outcomeNote:'',decidedBy:'',decidedAt:''}))}
      log('created project “'+p.name+'”');save();go('project-'+p.id);toast('Project created')}),
  'edit-project':el=>{const p=P(el.dataset.id);modal('Edit project',projectForm(p),'Save',data=>{Object.assign(p,{name:data.name,client:data.client,type:data.type,lead:data.lead,start:data.start,due:data.due,budget:+data.budget||0,currency:data.currency,color:data.color,description:data.description});commit('Project saved')},`<button type="button" class="btn danger" data-act="del-project" data-id="${p.id}" style="margin-right:auto">Delete project</button>`)},
  'del-project':el=>{const id=el.dataset.id;closeModal();confirmBox('Delete this project?','All its tasks, deliverables and assumptions will be removed. Export first if you want a copy.',()=>{S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(t=>t.projectId!==id);S.deliveries=S.deliveries.filter(t=>t.projectId!==id);S.assumptions=S.assumptions.filter(t=>t.projectId!==id);save();go('home');toast('Project deleted')})},
  'new-task':el=>{if(!S.projects.length)return toast('Create a project first');const r=route();const pid=(el&&el.dataset.id)||(r.name==='project'?r.id:S.projects[0].id);
    modal('New task',`<label class="lbl">Task<input class="field" name="title" id="nt-title" required placeholder="e.g. Book sound recordist for shoot day"></label>
    <div class="grid2"><label class="lbl">Project<select class="field" name="projectId" id="nt-p">${projOpts(pid)}</select></label><label class="lbl">Phase<select class="field" name="phase" id="nt-ph">${PHASES.map((p,i)=>`<option value="${i}">${i+1}. ${p}</option>`).join('')}</select></label></div>
    <div class="grid3"><label class="lbl">Assignee<select class="field" name="assignee" id="nt-a">${memberOpts(S.me,true)}</select></label><label class="lbl">Due<input class="field" type="date" name="due" id="nt-d" value="${addDays(3)}"></label><label class="lbl">Priority<select class="field" name="priority" id="nt-pr"><option>Medium</option><option>High</option><option>Low</option></select></label></div>`,'Add task',data=>{
      const t={id:uid('t'),projectId:data.projectId,title:data.title,phase:+data.phase,assignee:data.assignee,start:ymd(TODAY),due:data.due,priority:data.priority,status:(el&&el.dataset.status)||'todo',subtasks:[],comments:[],notes:''};S.tasks.push(t);log('added “'+t.title+'”');commit('Task added')})},
  'new-delivery':el=>{if(!S.projects.length)return toast('Create a project first');const r=route();const pid=(el&&el.dataset.id)||(r.name==='project'?r.id:S.projects[0].id);
    modal('New deliverable',`<label class="lbl">Deliverable<input class="field" name="title" id="nd-title" required placeholder="e.g. Testimonial film 3′ – Amharic subtitles"></label><label class="lbl">Technical spec<input class="field" name="spec" id="nd-spec" placeholder="e.g. H.264 1080p 16:9, 25 fps, -14 LUFS, SRT"></label>
    <div class="grid3"><label class="lbl">Project<select class="field" name="projectId" id="nd-p">${projOpts(pid)}</select></label><label class="lbl">Owner<select class="field" name="owner" id="nd-o">${memberOpts(S.me)}</select></label><label class="lbl">Due<input class="field" type="date" name="due" id="nd-d" value="${addDays(14)}"></label></div>`,'Add deliverable',data=>{
      const d={id:uid('d'),projectId:data.projectId,title:data.title,spec:data.spec,owner:data.owner,due:data.due,status:'In QC',returns:[],checks:QC.map(q=>({items:q.items.map(()=>false),by:'',at:'',note:''}))};S.deliveries.push(d);log('added deliverable “'+d.title+'”');save();render();openDrawer('delivery',d.id);toast('Deliverable added')})},
  'new-assumption':el=>{if(!S.projects.length)return toast('Create a project first');const r=route();const pid=(el&&el.dataset.id)||(r.name==='project'?r.id:S.projects[0].id);
    const a={id:uid('a'),projectId:pid,category:'Scope',text:'We assume ',evidence:'',confidence:'',ifWrong:'',impact:0,likelihood:0,owner:'',method:'',by:'',outcome:'',outcomeNote:'',decidedBy:'',decidedAt:''};S.assumptions.push(a);save();render();openDrawer('assumption',a.id);setTimeout(()=>{const x=document.getElementById('a-text-'+a.id);if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},30)},
  'new-member':()=>memberModal(),
  'edit-member':el=>memberModal(M(el.dataset.id)),
  'export':()=>{const json=JSON.stringify(Object.assign({},S,{ui:undefined}),null,1);
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='youthopians-studio-'+ymd(TODAY)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
    modal('Export workspace',`<p class="muted" style="margin:0">The desktop app saves a .json file to your Downloads folder. In a browser preview, copy the text below and keep it somewhere safe.</p><textarea class="field" id="exp-json" style="min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem" readonly>${esc(json)}</textarea>`,'',()=>{},`<button type="button" class="btn primary" data-act="copy-export" style="margin-right:auto">Copy to clipboard</button>`)},
  'copy-export':()=>{const t=document.getElementById('exp-json');const fb=()=>{t.focus();t.select();toast('Selected. Press Ctrl/⌘+C')};try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),fb)}catch(e){fb()}},
  'import':()=>modal('Import workspace',`<p class="muted" style="margin:0">Replace everything in this workspace with an exported file. Export first if you want to keep the current data.</p><div><button type="button" class="btn" data-act="pick-file">Choose .json file…</button></div><label class="lbl">…or paste exported text<textarea class="field" name="json" id="imp-json" style="min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem"></textarea></label>`,'Import pasted text',data=>doImport(data.json)),
  'pick-file':()=>document.getElementById('importFile').click(),
  'reset':()=>modal('Reset workspace',`<p style="margin:0">Choose how to reset. This replaces everything in this workspace.</p>`,'',()=>{},`<button type="button" class="btn" data-act="reset-sample">Reload samples</button><button type="button" class="btn danger" data-act="reset-empty" style="margin-right:auto">Start empty</button>`),
  'reset-sample':()=>{S=seed();closeModal();save();go('home');toast('Samples reloaded')},
  'reset-empty':()=>{const team=S.team;S=seed();S.sample=false;S.team=team.length?team:S.team;S.me=S.team[0].id;S.projects=[];S.tasks=[];S.deliveries=[];S.assumptions=[];S.activity=[];closeModal();save();go('home');toast('Workspace cleared. Team kept')}
};
function doImport(txt){try{const n=JSON.parse(txt);if(!n||!Array.isArray(n.projects)||!Array.isArray(n.team))throw 0;n.ui={tab:{},collapsed:{},filters:{}};S=n;save();closeModal();go('home');toast('Workspace imported');return true}catch(e){toast('That file is not a Youthopians Studio export');return false}}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f);e.target.value=''});
function confirmBox(title,msg,fn){modal(title,`<p style="margin:0">${esc(msg)}</p>`,'Delete',()=>{fn()})}
function memberModal(m){
  modal(m?'Edit member':'Add member',`<div class="grid2"><label class="lbl">Name<input class="field" name="name" id="mm-n" required value="${esc(m?m.name:'')}"></label><label class="lbl">Role<input class="field" name="role" id="mm-r" required value="${esc(m?m.role:'')}" placeholder="e.g. Director of Photography"></label></div><label class="lbl">Colour<select class="field" name="color" id="mm-c">${COLORS.map(c=>`<option value="${c}" ${m&&m.color===c?'selected':''}>${c}</option>`).join('')}</select></label>`,m?'Save':'Add member',data=>{
    if(m){Object.assign(m,data)}else S.team.push({id:uid('m'),name:data.name,role:data.role,color:data.color});commit(m?'Saved':'Member added')},
    m&&S.team.length>1?`<button type="button" class="btn danger" data-act="del-member" data-id="${m.id}" style="margin-right:auto">Remove</button>`:'');
}
actions['del-member']=el=>{const id=el.dataset.id;S.team=S.team.filter(m=>m.id!==id);S.tasks.forEach(t=>{if(t.assignee===id)t.assignee=''});if(S.me===id)S.me=S.team[0].id;closeModal();commit('Member removed. Their tasks are unassigned')};

/* field edits */
function setField(el){
  const f=el.dataset.f,id=el.dataset.id,v=el.value;
  if(f==='me'){S.me=v;return commit()}
  if(f==='filter.dl'){S.ui.filters.dl=v;return commit()}
  if(f==='filter.as'){S.ui.filters.as=v;return commit()}
  const [obj,key]=f.split('.');
  if(obj==='project'){const p=P(id);p[key]=v;if(key==='status')log('set “'+p.name+'” to '+v);return commit()}
  if(obj==='task'){const t=T(id);t[key]=key==='phase'?+v:v;if(key==='status'&&v==='done')log('completed “'+t.title+'”');return commit()}
  if(obj==='sub'){const t=T(id);t.subtasks[+el.dataset.i].t=v;return commit()}
  if(obj==='dl'){D(id)[key]=v;return commit()}
  if(obj==='as'){const a=A(id);a[key]=(key==='impact'||key==='likelihood')?+v:v;return commit()}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('[data-act]')){go(g.dataset.go);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){actions[a]&&actions[a](el);return}
  // inner buttons inside a clickable row win
  e.preventDefault();e.stopPropagation();
  if(actions[a])actions[a](el);
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.f)setField(e.target)});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const v=(f.elements[0]&&f.elements[0].value||'').trim();if(!v)return;
  if(f.dataset.form==='quick-add'){const p=P(f.dataset.id);const ph=+f.dataset.phase;S.tasks.push({id:uid('t'),projectId:p.id,title:v,phase:ph,assignee:S.me,start:ymd(TODAY),due:addDays(3),priority:'Medium',status:'todo',subtasks:[],comments:[],notes:''});log('added “'+v+'”');save();render();const n=document.getElementById('qa-'+p.id+'-'+ph);if(n)n.focus()}
  if(f.dataset.form==='add-sub'){const t=T(f.dataset.id);t.subtasks.push({t:v,d:false});save();render();const n=document.getElementById('addsub-'+t.id);if(n)n.focus()}
  if(f.dataset.form==='comment'){const t=T(f.dataset.id);t.comments.push({who:S.me,at:nowStamp(),text:v});log('commented on “'+t.title+'”');commit('Comment added')}
});
/* drag and drop on board */
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest('[data-drop]');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-drop]');if(!c)return;e.preventDefault();const t=T(e.dataTransfer.getData('text/plain'));if(t&&t.status!==c.dataset.drop){t.status=c.dataset.drop;if(t.status==='done')log('completed “'+t.title+'”');commit('Moved to '+STATUSES.find(s=>s[0]===t.status)[1])}else render()});
/* search */
const q=document.getElementById('q'),res=document.getElementById('results');
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(s.length<2){res.hidden=true;return}
  const hits=[].concat(
    S.projects.filter(p=>(p.name+' '+p.client).toLowerCase().includes(s)).map(p=>`<button data-go="project-${p.id}"><span class="tag">Project</span>${esc(p.name)}</button>`),
    S.tasks.filter(t=>t.title.toLowerCase().includes(s)).slice(0,10).map(t=>`<button data-act="open-task" data-id="${t.id}"><span class="tag">Task</span>${esc(t.title)} <span class="muted small">· ${esc((P(t.projectId)||{}).name||'')}</span></button>`),
    S.deliveries.filter(d=>d.title.toLowerCase().includes(s)).map(d=>`<button data-act="open-delivery" data-id="${d.id}"><span class="tag">Deliverable</span>${esc(d.title)}</button>`),
    S.assumptions.filter(a=>a.text.toLowerCase().includes(s)).map(a=>`<button data-act="open-assumption" data-id="${a.id}"><span class="tag">Assumption</span>${esc(a.text)}</button>`));
  res.innerHTML=hits.join('')||'<div class="empty">No matches</div>';res.hidden=false});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){res.hidden=true}else if(e.target.closest('.results button')){res.hidden=true;q.value=''}},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!document.getElementById('modal').hidden)closeModal();else if(drawerState)closeDrawer();res.hidden=true}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!typing&&e.key==='/'){e.preventDefault();q.focus()}
  if(!typing&&(e.key==='n'||e.key==='N')&&document.getElementById('modal').hidden){e.preventDefault();actions['new-task']()}
});

if(S.ui.theme)document.documentElement.setAttribute('data-theme',S.ui.theme);
render();
})();
</script>
