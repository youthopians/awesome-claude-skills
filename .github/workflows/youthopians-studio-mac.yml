name: Youthopians Studio macOS build

on:
  push:
    branches: [claude/youthful-shannon-uuqssp]
    paths:
      - 'youthopians-studio/**'
      - '.github/workflows/youthopians-studio-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youthopians-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Mac apps as zip (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac zip --arm64 --x64 --publish never
          ls -lh release/*.zip

      - name: Publish release with DMGs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youthopians-studio-v1.0.${{ github.run_number }}
          name: Youthopians Studio 1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Mac installers for Youthopians Studio.

            - **Apple Silicon (M1–M4):** `Youthopians-Studio-*-arm64-mac.zip`
            - **Intel Mac:** `Youthopians-Studio-*-x64-mac.zip`

            1. Double-click the zip. Drag **Youthopians Studio** into **Applications**.
            2. Open Terminal and paste:
               ```
               xattr -cr "/Applications/Youthopians Studio.app"
               codesign --force --deep --sign - "/Applications/Youthopians Studio.app"
               open "/Applications/Youthopians Studio.app"
               ```
          files: youthopians-studio/release/*-mac.zip
